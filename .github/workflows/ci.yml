name: fixture-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test disposable fixture
        run: |
          python3 - <<'PY'
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('.'))
          print('::notice title=Test results::tests=%d failures=%d skips=%d' %
                (result.testsRun, len(result.failures) + len(result.errors), len(result.skipped)))
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
